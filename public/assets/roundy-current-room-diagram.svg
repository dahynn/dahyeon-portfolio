<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Roundy Redis currentRoom race condition</title>
  <desc id="desc">새 세션 B 배정과 지연된 이전 세션 A 정리 요청이 Redis currentRoom에서 충돌하고, 현재 방 비교로 새 방 삭제를 막는 흐름</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#111827" flood-opacity=".08"/></filter>
    <marker id="arrowPink" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1l8 4.5L1 10" fill="none" stroke="#e94492" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowGray" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1l8 4.5L1 10" fill="none" stroke="#727982" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Pretendard,"Apple SD Gothic Neo",Arial,sans-serif;fill:#202328}.eyebrow{font-size:18px;font-weight:900;letter-spacing:2px}.title{font-size:27px;font-weight:850}.cardTitle{font-size:25px;font-weight:850}.body{font-size:17px;fill:#687079}.small{font-size:15px;fill:#747c84}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:19px;font-weight:750}.pink{fill:#e94492}.white{fill:#fff}.center{text-anchor:middle}.label{font-size:14px;font-weight:900;letter-spacing:1.5px;fill:#8a9199}
    </style>
  </defs>

  <rect x="2" y="2" width="1596" height="896" rx="30" fill="#fff" stroke="#d7dade" stroke-width="4"/>
  <text x="55" y="68" class="eyebrow pink">RACE CONDITION</text>
  <text x="265" y="68" class="title">두 요청이 만나는 순간, Redis의 currentRoom</text>
  <line x1="55" y1="96" x2="1545" y2="96" stroke="#e2e4e7" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="55" y="135" width="405" height="365" rx="20" fill="#fafaf8" stroke="#d7dade" stroke-width="3"/>
    <path d="M75 136h365a20 20 0 0 1 20 20" fill="none" stroke="#e94492" stroke-width="7"/>
    <circle cx="100" cy="185" r="22" fill="#e94492"/><text x="100" y="192" class="white center" font-size="19" font-weight="900">1</text>
    <text x="145" y="178" class="label">REQUEST 01 · t0</text>
    <text x="145" y="220" class="cardTitle">새 세션 B 배정</text>
    <text x="145" y="254" class="body">매칭 완료 후 현재 방을 B로 교체</text>
    <circle cx="257" cy="332" r="41" fill="#fff" stroke="#efb3d0" stroke-width="3"/>
    <circle cx="257" cy="319" r="13" fill="#e94492"/><path d="M231 360c5-22 47-22 52 0" fill="none" stroke="#e94492" stroke-width="7" stroke-linecap="round"/>
    <rect x="95" y="410" width="325" height="58" rx="10" fill="#eef0f1"/>
    <text x="257" y="447" class="code center">SET currentRoom B</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="535" y="135" width="530" height="365" rx="20" fill="#fff8fb" stroke="#efb3d0" stroke-width="3"/>
    <g transform="translate(585 166)">
      <path d="M31 0L60 13 31 26 2 13z" fill="#d82c20"/>
      <path d="M2 22l29 13 29-13v11L31 46 2 33z" fill="#e43b2f"/>
      <path d="M2 39l29 13 29-13v11L31 63 2 50z" fill="#ef4b3e"/>
      <circle cx="20" cy="12" r="3" fill="#fff"/><circle cx="31" cy="8" r="3" fill="#fff"/><path d="M38 15l8-4" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="665" y="193" class="cardTitle">Redis</text>
    <text x="665" y="220" class="small">currentRoom · userId → roomId</text>
    <rect x="605" y="250" width="390" height="100" rx="13" fill="#fff" stroke="#cbd0d5" stroke-width="3"/>
    <text x="800" y="279" class="label center">LATEST STATE</text>
    <text x="800" y="315" class="title center">currentRoom = B</text>
    <text x="800" y="340" class="small center">새 방으로 덮어쓴 상태</text>
    <path d="M800 352v33" stroke="#e94492" stroke-width="2.5" marker-end="url(#arrowPink)"/>
    <rect x="620" y="390" width="360" height="78" rx="14" fill="#fdebf4" stroke="#e94492" stroke-width="3"/>
    <text x="800" y="420" class="small center pink">조건 없는 DEL</text>
    <text x="800" y="451" class="cardTitle center pink">새 방 B까지 유실</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1140" y="135" width="405" height="365" rx="20" fill="#fafaf8" stroke="#d7dade" stroke-width="3"/>
    <path d="M1160 136h365a20 20 0 0 1 20 20" fill="none" stroke="#7b828a" stroke-width="7"/>
    <circle cx="1185" cy="185" r="22" fill="#747c85"/><text x="1185" y="192" class="white center" font-size="19" font-weight="900">2</text>
    <text x="1230" y="178" class="label">REQUEST 02 · t1</text>
    <text x="1230" y="220" class="cardTitle">이전 세션 A 정리</text>
    <text x="1230" y="254" class="body">네트워크 지연 뒤 과거 요청이 도착</text>
    <circle cx="1342" cy="332" r="41" fill="#fff" stroke="#c9ced3" stroke-width="3"/>
    <circle cx="1342" cy="319" r="13" fill="#747c85"/><path d="M1316 360c5-22 47-22 52 0" fill="none" stroke="#747c85" stroke-width="7" stroke-linecap="round"/>
    <rect x="1180" y="410" width="325" height="58" rx="10" fill="#eef0f1"/>
    <text x="1342" y="447" class="code center">DEL currentRoom</text>
  </g>

  <circle cx="420" cy="426" r="7" fill="#e94492" stroke="#fff" stroke-width="4"/>
  <path d="M425 422L610 310" fill="none" stroke="#e94492" stroke-width="3" marker-end="url(#arrowPink)"/>
  <text x="493" y="350" class="eyebrow pink">t0</text>
  <circle cx="1180" cy="426" r="7" fill="#727982" stroke="#fff" stroke-width="4"/>
  <path d="M1175 426L978 426" fill="none" stroke="#727982" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrowGray)"/>
  <text x="1032" y="398" class="eyebrow" fill="#727982">NETWORK DELAY</text>

  <line x1="270" y1="468" x2="270" y2="543" stroke="#e94492" stroke-width="3" stroke-dasharray="9 8"/>
  <line x1="1330" y1="468" x2="1330" y2="543" stroke="#e94492" stroke-width="3" stroke-dasharray="9 8"/>
  <line x1="80" y1="555" x2="1520" y2="555" stroke="#d98ab0" stroke-width="3"/>
  <circle cx="270" cy="555" r="12" fill="#e94492" stroke="#fff" stroke-width="5"/>
  <text x="270" y="532" class="eyebrow center pink">t0</text><text x="270" y="602" class="small center">새 세션 B 배정 요청</text>
  <circle cx="1330" cy="555" r="12" fill="#e94492" stroke="#fff" stroke-width="5"/>
  <text x="1330" y="589" class="eyebrow center pink">t1</text><text x="1330" y="616" class="small center">이전 세션 A 정리 요청 · 지연 도착</text>

  <text x="55" y="680" class="eyebrow pink">SOLUTION</text>
  <text x="188" y="680" class="title">현재 방을 확인하고, 일치할 때만 삭제</text>
  <g filter="url(#shadow)">
    <rect x="55" y="720" width="390" height="120" rx="17" fill="#fff" stroke="#cfd3d7" stroke-width="3"/>
    <text x="85" y="755" class="label">GUARD</text><text x="85" y="788" font-size="22" font-weight="850">삭제 전 현재 방 확인</text><text x="85" y="820" class="code">currentRoom == roomId ?</text>
    <path d="M462 780h70" stroke="#7d858d" stroke-width="2.5" marker-end="url(#arrowGray)"/>
    <rect x="550" y="720" width="310" height="120" rx="17" fill="#fff" stroke="#cfd3d7" stroke-width="3"/>
    <text x="580" y="755" class="label">COMPARE</text><text x="705" y="793" class="title center">A ≠ B</text><text x="705" y="822" class="small center">현재 방 B · 정리 대상 A</text>
    <path d="M878 780h70" stroke="#7d858d" stroke-width="2.5" marker-end="url(#arrowGray)"/>
    <rect x="965" y="720" width="580" height="120" rx="17" fill="#fff7fb" stroke="#e94492" stroke-width="3"/>
    <circle cx="1020" cy="780" r="30" fill="#e94492"/><path d="M1006 780l10 10 19-22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1070" y="775" class="cardTitle pink">삭제하지 않음</text><text x="1070" y="810" class="body">새로 배정된 방 B를 보호합니다.</text>
  </g>
</svg>
