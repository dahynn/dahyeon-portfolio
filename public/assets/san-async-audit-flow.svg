<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">비동기 작업의 요청 맥락 전달과 감사 로그 기록 흐름</title>
  <desc id="desc">사용자 요청에서 감사 스냅샷을 생성해 큐와 워커로 전달하고 시작 성공 실패를 기록한 뒤 워커의 기존 컨텍스트를 복원하는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#18e486" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6d8579" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.lane{font-size:12px;font-weight:950;fill:#18e486;letter-spacing:1.1px}.title{font-size:17px;font-weight:900;fill:#f3f8f5}.sub{font-size:11px;font-weight:650;fill:#8fa198}.body{font-size:12px;font-weight:680;fill:#c6d2cc}.key{font-size:11px;font-weight:800;fill:#82968c}.micro{font-size:10px;font-weight:900;fill:#779085;letter-spacing:.8px}.status{font-size:11px;font-weight:950}.flow{fill:none;stroke:#18e486;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>

  <text x="30" y="28" class="micro" fill="#18e486">ASYNC AUDIT PIPELINE</text>
  <text x="1570" y="28" class="micro" text-anchor="end">한 요청의 Context와 실행 결과를 같은 traceId로 연결</text>

  <g aria-label="Request lane">
    <rect x="28" y="52" width="558" height="286" rx="12" fill="#07140f" stroke="#18382b"/>
    <path d="M28 66V52h14" fill="none" stroke="#18e486" stroke-width="3"/>
    <text x="46" y="78" class="lane">01 · REQUEST</text>

    <g transform="translate(50 124)">
      <text x="46" y="8" class="micro" text-anchor="middle">CLIENT</text>
      <circle cx="46" cy="51" r="25" fill="#0b2017" stroke="#2c6c4c"/>
      <circle cx="46" cy="44" r="7" fill="none" stroke="#18e486" stroke-width="1.7"/>
      <path d="M33 64c3-12 23-12 26 0" fill="none" stroke="#18e486" stroke-width="1.7" stroke-linecap="round"/>
      <text x="46" y="91" class="body" text-anchor="middle">웹 · 익스텐션 · API</text>
    </g>

    <path d="M154 184H184" class="flow"/>
    <g transform="translate(190 120)">
      <rect width="142" height="128" rx="9" fill="#0a1c14" stroke="#2a5541"/>
      <text x="16" y="28" class="micro">HTTP REQUEST</text>
      <text x="16" y="57" class="title">작업 요청</text>
      <text x="16" y="82" class="mono" font-size="11" fill="#a9f4ca">POST /api/jobs</text>
      <rect x="16" y="99" width="84" height="18" rx="9" fill="#103020"/>
      <text x="58" y="112" font-size="9" font-weight="850" fill="#18e486" text-anchor="middle">ASYNC JOB</text>
    </g>

    <path d="M338 184H366" class="flow"/>
    <g transform="translate(372 92)">
      <rect width="190" height="184" rx="9" fill="#0a1c14" stroke="#2a5541"/>
      <text x="16" y="27" class="micro">REQUEST SNAPSHOT</text>
      <text x="16" y="54" class="title">요청 맥락 고정</text>
      <text x="16" y="74" class="sub">큐에 넣는 시점의 정보를 저장</text>
      <line x1="16" y1="88" x2="174" y2="88" stroke="#1d3f30"/>
      <text x="16" y="111" class="key">actorUserId</text><text x="105" y="111" class="mono" font-size="10" fill="#a9f4ca">user-1024</text>
      <text x="16" y="133" class="key">traceId</text><text x="105" y="133" class="mono" font-size="10" fill="#c6d2cc">tr_c8f9...</text>
      <text x="16" y="155" class="key">IP</text><text x="105" y="155" class="mono" font-size="10" fill="#c6d2cc">203.0.113.10</text>
      <text x="16" y="177" class="key">User-Agent</text><text x="105" y="177" class="mono" font-size="10" fill="#c6d2cc">Chrome/118</text>
    </g>
  </g>

  <path d="M586 184H622" class="flow"/>

  <g aria-label="Queue lane">
    <rect x="628" y="52" width="214" height="286" rx="12" fill="#07140f" stroke="#18382b"/>
    <path d="M628 66V52h14" fill="none" stroke="#18e486" stroke-width="3"/>
    <text x="646" y="78" class="lane">02 · QUEUE</text>
    <rect x="650" y="102" width="170" height="174" rx="9" fill="#0a1c14" stroke="#2a5541"/>
    <image href="/assets/tech-icons/redis.svg" x="668" y="122" width="32" height="32"/>
    <text x="712" y="143" class="title">작업 큐</text>
    <text x="668" y="169" class="sub">Redis / Message Queue</text>
    <line x1="668" y1="184" x2="802" y2="184" stroke="#1d3f30"/>
    <text x="668" y="209" class="body">job payload</text>
    <text x="668" y="232" class="body">context snapshot</text>
    <text x="668" y="255" class="mono" font-size="11" fill="#a9f4ca">traceId</text>
  </g>

  <path d="M842 184H878" class="flow"/>

  <g aria-label="Worker lane">
    <rect x="884" y="52" width="300" height="286" rx="12" fill="#07140f" stroke="#18382b"/>
    <path d="M884 66V52h14" fill="none" stroke="#18e486" stroke-width="3"/>
    <text x="902" y="78" class="lane">03 · WORKER</text>
    <rect x="906" y="102" width="256" height="198" rx="9" fill="#0a1c14" stroke="#2a5541"/>
    <text x="924" y="132" class="title">요청 Context 복원</text>
    <text x="924" y="153" class="sub">Snapshot을 현재 실행 스레드에 적용</text>
    <line x1="924" y1="168" x2="1144" y2="168" stroke="#1d3f30"/>
    <circle cx="929" cy="192" r="4" fill="#18e486"/><text x="944" y="197" class="body">사용자 · traceId · IP</text>
    <circle cx="929" cy="218" r="4" fill="#18e486"/><text x="944" y="223" class="body">비동기 작업 실행</text>
    <circle cx="929" cy="244" r="4" fill="#18e486"/><text x="944" y="249" class="body">실행 결과와 duration 전달</text>
    <rect x="922" y="264" width="224" height="24" rx="12" fill="#07140f" stroke="#278251"/>
    <text x="1034" y="280" font-size="10" font-weight="900" fill="#9ff3c3" text-anchor="middle">기존 Context 복원</text>
  </g>

  <path d="M1184 184H1220" class="flow"/>

  <g aria-label="Audit store lane">
    <rect x="1226" y="52" width="346" height="286" rx="12" fill="#07140f" stroke="#18382b"/>
    <path d="M1226 66V52h14" fill="none" stroke="#18e486" stroke-width="3"/>
    <text x="1244" y="78" class="lane">04 · AUDIT STORE</text>
    <rect x="1248" y="102" width="302" height="198" rx="9" fill="#0a1c14" stroke="#2a5541"/>
    <text x="1266" y="132" class="title">감사 로그 저장소</text>
    <text x="1266" y="153" class="sub">같은 traceId로 실행 이력 연결</text>
    <line x1="1266" y1="168" x2="1532" y2="168" stroke="#1d3f30"/>
    <path d="M1281 190V264" stroke="#315947" stroke-width="1.5"/>
    <circle cx="1281" cy="192" r="5" fill="#18e486"/><text x="1298" y="197" class="status" fill="#18e486">START</text><text x="1392" y="197" class="sub">작업 시작</text>
    <circle cx="1281" cy="226" r="5" fill="#18e486"/><text x="1298" y="231" class="status" fill="#18e486">SUCCESS</text><text x="1392" y="231" class="sub">결과 · duration</text>
    <circle cx="1281" cy="260" r="5" fill="#ff6268"/><text x="1298" y="265" class="status" fill="#ff7176">FAILURE</text><text x="1392" y="265" class="sub">error · duration</text>
  </g>

  <path d="M1498 300V360H1034V292" fill="none" stroke="#6d8579" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowMuted)"/>
  <rect x="1175" y="347" width="212" height="26" rx="13" fill="#07140f" stroke="#29483a"/>
  <text x="1281" y="364" font-size="10" font-weight="900" fill="#96aaa0" text-anchor="middle"><tspan fill="#18e486">FINALLY</tspan><tspan> · 이전 Context로 복귀</tspan></text>

  <text x="30" y="399" class="sub">요청 시점의 Snapshot은 큐와 Worker를 지나도 유지됩니다.</text>
  <text x="1570" y="399" class="sub" text-anchor="end">실행 종료 후 Worker의 원래 Context를 복원합니다.</text>
</svg>
