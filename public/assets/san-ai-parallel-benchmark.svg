    <style>text{font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.eyebrow{font-size:15px;font-weight:800;letter-spacing:1px;fill:#809a8c}.section{font-size:20px;font-weight:900;fill:#244b3b}.sub{font-size:14px;font-weight:700;fill:#6d8376}.card-label{font-size:14px;font-weight:800;letter-spacing:.7px;fill:#648073}.card-time{font-size:29px;font-weight:850;fill:#1b3027}.result-label{font-size:15px;font-weight:800;fill:#5e796b}.result-time{font-size:38px;font-weight:900;fill:#1b3027}.green{fill:#397e68}.trace{fill:none;stroke:#b6e3d1;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:0 100;opacity:0;animation:san-benchmark-draw 5.8s ease-in-out infinite}.trace-seq-2{animation-delay:.55s}.trace-seq-3{animation-delay:1.1s}.trace-fan{animation-delay:.25s}.trace-join{animation-delay:1.65s}@keyframes san-benchmark-draw{0%,2%{stroke-dasharray:0 100;opacity:0}4%{opacity:1}20%{stroke-dasharray:100 0;opacity:1}24%,100%{opacity:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none;opacity:0}}</style>
