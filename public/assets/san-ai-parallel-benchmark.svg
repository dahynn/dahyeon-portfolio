<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="title desc">
  <title id="title">카드 요약 순차 처리와 동시 처리 비교</title>
  <desc id="desc">위쪽은 카드 3개를 5.21초, 6.32초, 6.15초에 순차 처리해 총 17.68초입니다. 아래쪽은 같은 카드 3개를 동시에 시작해 각각 6.92초, 6.91초, 6.87초에 완료했으며 전체 소요 시간은 6.92초입니다.</desc>
